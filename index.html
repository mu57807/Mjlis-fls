<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Majlis FLS</title>
<meta name="description" content="Majlis FLS — a safety engagement platform for frontline supervisors">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Auth gate: covers the app until the user has a verified session + profile -->
<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div class="brand auth-brand">
      <span class="brand-mark" aria-hidden="true">🛡️</span>
      <span class="brand-name">Majlis FLS</span>
    </div>

    <div id="authStepRequest">
      <h1 class="auth-title" id="authRequestTitle"></h1>
      <p class="auth-sub" id="authRequestSub"></p>

      <label class="field-label" id="authCodeLabel"></label>
      <input id="authCode" class="field-select" type="text" autocapitalize="characters" autocomplete="off">

      <label class="field-label" id="authNameLabel"></label>
      <input id="authName" class="field-select" type="text" autocomplete="name">

      <label class="field-label" id="authJobTitleLabel"></label>
      <input id="authJobTitle" class="field-select" type="text" autocomplete="organization-title">

      <label class="field-label" id="authEmailLabel"></label>
      <input id="authEmail" class="field-select" type="email" autocomplete="email">

      <button id="authRequestBtn" class="btn btn-primary wide" type="button"></button>
      <p class="auth-error" id="authRequestError" hidden></p>
    </div>

    <div id="authStepVerify" hidden>
      <h1 class="auth-title" id="authVerifyTitle"></h1>
      <p class="auth-sub" id="authVerifySub"></p>

      <label class="field-label" id="authOtpLabel"></label>
      <input id="authOtp" class="field-select" type="text" inputmode="numeric" autocomplete="one-time-code">

      <button id="authVerifyBtn" class="btn btn-primary wide" type="button"></button>
      <button id="authBackBtn" class="btn btn-secondary wide" type="button"></button>
      <p class="auth-error" id="authVerifyError" hidden></p>
    </div>

    <div class="auth-loading" id="authLoading" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span id="authLoadingLabel"></span>
    </div>
  </div>
</div>

<div class="app-shell" id="appShell" hidden>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🛡️</span>
      <span class="brand-name">Majlis FLS</span>
    </div>
    <div class="topbar-actions">
      <button id="adminNavBtn" class="lang-toggle" type="button" hidden></button>
      <button id="langToggle" class="lang-toggle" type="button">العربية</button>
      <button id="signOutBtn" class="lang-toggle icon-btn" type="button" title="Sign out">⏻</button>
    </div>
  </header>

  <main class="feed-scroll" id="mainScroll">

    <!-- 1. Theme banner -->
    <section class="theme-banner">
      <span class="theme-badge" id="themeBadge"></span>
      <h1 class="theme-title" id="themeTitle"></h1>
      <p class="theme-prompt" id="themePrompt"></p>
      <button class="btn btn-record" id="recordBtn" type="button">
        <span class="icon" aria-hidden="true">🎥</span>
        <span id="recordBtnLabel"></span>
      </button>
    </section>

    <!-- 2. Message from leadership -->
    <section class="section">
      <h2 class="section-heading" id="leadershipHeading"></h2>
      <div id="leadershipCard"></div>
    </section>

    <!-- 3. Learning from incidents -->
    <section class="section">
      <h2 class="section-heading" id="learningHeading"></h2>
      <div class="learning-row" id="learningRow"></div>
    </section>

    <!-- 4. The feed -->
    <section class="section feed-section">
      <h2 class="section-heading" id="feedHeading"></h2>
      <div class="feed-list" id="feedList"></div>
    </section>

    <div class="feed-end-spacer"></div>
  </main>

  <!-- Ifada CTA -->
  <div class="ifada-bar">
    <button class="ifada-btn" id="ifadaBtn" type="button">
      <span class="icon" aria-hidden="true">⚠️</span>
      <span class="ifada-text">
        <strong id="ifadaBtnLabel"></strong>
        <small id="ifadaSubLabel"></small>
      </span>
      <span class="chev" aria-hidden="true">›</span>
    </button>
  </div>
</div>

<!-- Post viewer modal -->
<div class="modal-overlay" id="postModal" hidden>
  <div class="modal post-modal">
    <button class="modal-close" id="postModalClose" type="button" aria-label="Close">✕</button>
    <div class="post-video" id="postVideoArea">
      <button class="play-btn" id="postPlayBtn" type="button" aria-label="Play">▶</button>
    </div>
    <div class="post-modal-body">
      <div class="post-modal-header">
        <div class="avatar" id="postModalAvatar"></div>
        <div class="post-modal-who">
          <div class="post-modal-name" id="postModalName"></div>
          <div class="post-modal-site" id="postModalSite"></div>
        </div>
        <button class="like-btn" id="postModalLike" type="button">
          <span class="heart" id="postModalHeart">♡</span>
          <span id="postModalLikeCount">0</span>
        </button>
      </div>
      <p class="post-modal-caption" id="postModalCaption"></p>
      <div class="comments-list" id="postModalComments"></div>
    </div>
    <div class="comment-composer">
      <span class="reply-chip" id="replyChip" hidden></span>
      <input type="text" id="commentInput" class="comment-input" autocomplete="off">
      <button class="send-btn" id="commentSend" type="button"></button>
    </div>
  </div>
</div>

<!-- Media viewer modal (leadership / learning) -->
<div class="modal-overlay" id="mediaModal" hidden>
  <div class="modal media-modal">
    <button class="modal-close" id="mediaModalClose" type="button" aria-label="Close">✕</button>
    <div class="post-video" id="mediaVideoArea">
      <button class="play-btn" id="mediaPlayBtn" type="button" aria-label="Play">▶</button>
    </div>
    <div class="media-modal-body">
      <div class="media-modal-title" id="mediaModalTitle"></div>
      <div class="media-modal-meta" id="mediaModalMeta"></div>
    </div>
  </div>
</div>

<!-- Record modal -->
<div class="modal-overlay" id="recordModal" hidden>
  <div class="modal record-modal">
    <button class="modal-close" id="recordModalClose" type="button" aria-label="Close">✕</button>
    <div class="record-header">
      <span id="respondingToLabel"></span>
      <strong id="recordThemeTitle"></strong>
    </div>

    <input type="file" id="videoFileInput" accept="video/*" capture="user" hidden>

    <div class="record-stage" id="recordStage">
      <div class="record-camera" id="recordCamera">
        <div class="record-hint" id="recordHint"></div>
      </div>
      <button class="btn btn-record wide" id="startRecordBtn" type="button"></button>
    </div>

    <div class="record-preview" id="recordPreview" hidden>
      <video class="record-video-preview" id="recordVideoPreview" playsinline muted loop controls></video>
      <p class="record-posting-as" id="recordPostingAs"></p>
      <label class="field-label" id="captionLabel"></label>
      <textarea id="captionInput" class="field-textarea" rows="2"></textarea>
      <div class="record-actions">
        <button class="btn btn-secondary" id="retakeBtn" type="button"></button>
        <button class="btn btn-primary" id="postRecordBtn" type="button"></button>
      </div>
    </div>

    <div class="record-progress" id="recordProgress" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span id="recordProgressLabel"></span>
    </div>
  </div>
</div>

<!-- Admin panel -->
<div class="modal-overlay" id="adminModal" hidden>
  <div class="modal admin-modal">
    <button class="modal-close" id="adminModalClose" type="button" aria-label="Close">✕</button>
    <div class="admin-header">
      <h2 id="adminTitle"></h2>
      <div class="admin-tabs" id="adminTabs">
        <button class="admin-tab" data-tab="codes" type="button" id="adminTabCodes"></button>
        <button class="admin-tab" data-tab="theme" type="button" id="adminTabTheme"></button>
        <button class="admin-tab" data-tab="leadership" type="button" id="adminTabLeadership"></button>
        <button class="admin-tab" data-tab="materials" type="button" id="adminTabMaterials"></button>
        <button class="admin-tab" data-tab="posts" type="button" id="adminTabPosts"></button>
      </div>
    </div>
    <div class="admin-body" id="adminBody">

      <section class="admin-panel" id="adminPanelCodes">
        <form class="admin-form" id="inviteCodeForm">
          <div class="admin-form-row">
            <input id="codeCompany" class="field-select" type="text" required>
            <input id="codeSite" class="field-select" type="text" required>
          </div>
          <div class="admin-form-row">
            <select id="codeRole" class="field-select">
              <option value="member" id="codeRoleMemberOpt"></option>
              <option value="admin" id="codeRoleAdminOpt"></option>
            </select>
            <input id="codeMaxUses" class="field-select" type="number" min="1" value="1">
          </div>
          <button class="btn btn-primary wide" id="createCodeBtn" type="submit"></button>
        </form>
        <div class="admin-list" id="inviteCodeList"></div>
      </section>

      <section class="admin-panel" id="adminPanelTheme" hidden>
        <form class="admin-form" id="themeForm">
          <input id="themeQuarterLabel" class="field-select" type="text" required>
          <input id="themeTitleEn" class="field-select" type="text" required>
          <input id="themeTitleAr" class="field-select" type="text" required dir="rtl">
          <textarea id="themePromptEn" class="field-textarea" rows="2" required></textarea>
          <textarea id="themePromptAr" class="field-textarea" rows="2" required dir="rtl"></textarea>
          <button class="btn btn-primary wide" id="createThemeBtn" type="submit"></button>
        </form>
        <div class="admin-list" id="themeList"></div>
      </section>

      <section class="admin-panel" id="adminPanelLeadership" hidden>
        <form class="admin-form" id="leadershipForm">
          <input id="leaderName" class="field-select" type="text" required>
          <input id="leaderTitleEn" class="field-select" type="text" required>
          <input id="leaderTitleAr" class="field-select" type="text" required dir="rtl">
          <input id="leaderCaptionEn" class="field-select" type="text" required>
          <input id="leaderCaptionAr" class="field-select" type="text" required dir="rtl">
          <input id="leaderVideoFile" class="field-select" type="file" accept="video/*">
          <button class="btn btn-primary wide" id="saveLeadershipBtn" type="submit"></button>
        </form>
      </section>

      <section class="admin-panel" id="adminPanelMaterials" hidden>
        <form class="admin-form" id="materialForm">
          <select id="materialType" class="field-select">
            <option value="video" id="materialTypeVideoOpt"></option>
            <option value="doc" id="materialTypeDocOpt"></option>
          </select>
          <input id="materialTitleEn" class="field-select" type="text" required>
          <input id="materialTitleAr" class="field-select" type="text" required dir="rtl">
          <input id="materialMeta" class="field-select" type="text">
          <input id="materialFile" class="field-select" type="file" required>
          <button class="btn btn-primary wide" id="addMaterialBtn" type="submit"></button>
        </form>
        <div class="admin-list" id="materialList"></div>
      </section>

      <section class="admin-panel" id="adminPanelPosts" hidden>
        <div class="admin-list" id="adminPostList"></div>
      </section>

    </div>
  </div>
</div>

<!-- Ifada modal -->
<div class="modal-overlay" id="ifadaModal" hidden>
  <div class="modal ifada-modal">
    <button class="modal-close" id="ifadaModalClose" type="button" aria-label="Close">✕</button>
    <div class="ifada-modal-icon">⚠️</div>
    <h3 id="ifadaModalTitle"></h3>
    <p id="ifadaModalBody"></p>
    <button class="btn btn-danger wide" id="ifadaContinueBtn" type="button"></button>
    <div class="demo-notice" id="ifadaDemoNotice"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
